name: Build llama.cpp (Lean RTX 5080)

on:
  workflow_dispatch:

jobs:
  cuda:
    name: windows-cuda (13.4, x64)
    runs-on: windows-2022

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.4'
          cuda_arch: 'x64'

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=120 ^
            -DLLAMA_BUILD_BORINGSSL=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Gather CUDA Runtime DLLs
        shell: pwsh
        run: |
          $CUDA_PATH = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.4"
          Copy-Item "$CUDA_PATH\bin\cudart64_13*.dll" -Destination "build\bin\Release\"
          Copy-Item "$CUDA_PATH\bin\cublas64_13*.dll" -Destination "build\bin\Release\"
          Copy-Item "$CUDA_PATH\bin\cublasLt64_13*.dll" -Destination "build\bin\Release\"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-rtx5080
          path: build\bin\Release\
